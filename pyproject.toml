[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathe-resistance"
version = "0.1.0"
description = "Build walking graphs with auditable GeoAI-derived environmental resistance."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "nalinikantheti"}]
dependencies = [
  "geopandas>=1.0,<2", "networkx>=3.2,<4", "numpy>=1.26,<3",
  "osmnx>=2.0,<3", "pandas>=2.1,<3", "pyproj>=3.6,<4",
  "rasterio>=1.3,<2", "shapely>=2.0,<3", "affine>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]
geoai = ["torch>=2.2,<3", "transformers>=4.44,<5", "Pillow>=10,<13", "safetensors>=0.4,<1"]
map = ["folium>=0.14,<1"]
notebook = ["ipykernel>=6,<8", "notebook>=7,<8"]

[project.urls]
Repository = "https://github.com/nalinikantheti/pathe-resistance"
Issues = "https://github.com/nalinikantheti/pathe-resistance/issues"

[project.scripts]
pathe-resistance = "pathe_resistance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
